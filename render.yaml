# Render Blueprint for Iron Oath.
# Set the sync:false values in the Render dashboard before the first deploy.
# The paid plan is required for preDeployCommand migrations on Render.
services:
  - type: web
    name: iron-oath
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade && flask seed-exercises
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
